<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Beta</title>
  <desc id="desc">Capsule logo with a blue, violet and pink gradient and white outlined Beta lettering. Transparent background.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0.2" x2="1" y2="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00c9ef"/>
      <stop offset="0.23" stop-color="#0649ff"/>
      <stop offset="0.48" stop-color="#6809fa"/>
      <stop offset="0.72" stop-color="#eb00e8"/>
      <stop offset="1" stop-color="#ff0089"/>
    </linearGradient>
    <radialGradient id="cyan" cx="0.12" cy="0.03" r="0.65">
      <stop stop-color="#00def2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00def2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0.94" cy="0.24" r="0.65">
      <stop stop-color="#ff88cf" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff88cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.22" cy="1" r="0.55">
      <stop stop-color="#c139ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c139ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.68" cy="1.08" r="0.52">
      <stop stop-color="#ff80dc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff80dc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <rect x="40" y="40" width="1120" height="360" rx="180" fill="url(#base)"/>
    <rect x="40" y="40" width="1120" height="360" rx="180" fill="url(#cyan)"/>
    <rect x="40" y="40" width="1120" height="360" rx="180" fill="url(#rose)"/>
    <rect x="40" y="40" width="1120" height="360" rx="180" fill="url(#violet)"/>
    <rect x="40" y="40" width="1120" height="360" rx="180" fill="url(#pink)"/>
  </g>
  <!-- Letterforms are paths: no external font dependency. -->
